[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "besspulse"
version = "1.0.0"
description = "Reproducible reduced-order BESS telemetry simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "joblib>=1.4,<2",
  "xgboost>=2.1,<3",
  "shap>=0.46,<0.50",
  "cvxpy>=1.6,<1.7",
  "highspy>=1.7,<2",
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "streamlit>=1.37,<2",
  "plotly>=5.24,<6",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "mlflow-skinny>=2.17,<4",
]

[project.optional-dependencies]
plots = [
  "matplotlib>=3.8,<4",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "types-PyYAML>=6.0",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: optional PostgreSQL integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"dashboard/**/*.py" = ["E501"]
"tests/test_dashboard.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["besspulse", "api", "dashboard"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "xgboost.*", "shap.*", "cvxpy.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlflow.*", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"
