name: besspulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: besspulse_test
      POSTGRES_USER: besspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-besspulse_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besspulse -d besspulse_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://besspulse:${POSTGRES_PASSWORD:-besspulse_local_only}@postgres:5432/besspulse_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://besspulse:${POSTGRES_PASSWORD:-besspulse_local_only}@postgres:5432/besspulse_test
      API_CORS_ORIGINS: http://localhost:8501
      ENABLE_SIMULATION_CONTROL_API: "false"
      RAG_BACKEND: local
      API_JSON_LOGS: "true"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      APP_ENV: production
      BESSPULSE_API_URL: http://api:8000/api/v1
      DASHBOARD_DEMO_FALLBACK: "false"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
